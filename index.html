<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홈페이지 제작 관리 | 한번마케팅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#f8f7f4; --surface:#fff; --surface2:#f3f2ef; --border:#e8e6e1; --border2:#d4d1ca;
  --text:#1a1917; --text2:#6b6860; --text3:#9e9b95;
  --accent:#1a6b4a; --accent-bg:#e8f5ee; --accent-text:#0f4a32;
  --danger:#b91c1c; --danger-bg:#fee2e2;
  --radius:8px; --radius-lg:12px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
.layout{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-brand{padding:16px;border-bottom:1px solid var(--border)}
.brand-name{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:7px}
.brand-name i{color:var(--accent);font-size:14px}
.brand-sub{font-size:11px;color:var(--text3);margin-top:2px}
.sidebar-nav{padding:10px 10px 6px;}
.nav-btn{width:100%;padding:10px 12px;border-radius:var(--radius);cursor:pointer;border:none;background:linear-gradient(135deg,#1a6b4a 0%,#0f4a32 100%);font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px;transition:all .2s;text-align:left;box-shadow:0 2px 8px rgba(26,107,74,0.3);letter-spacing:0.01em}
.nav-btn:hover{background:linear-gradient(135deg,#155a3e 0%,#0a3525 100%);box-shadow:0 4px 12px rgba(26,107,74,0.4);transform:translateY(-1px)}
.nav-btn.active{background:linear-gradient(135deg,#0f4a32 0%,#083020 100%);box-shadow:0 2px 6px rgba(26,107,74,0.5)}
.nav-btn i{font-size:13px;width:14px;text-align:center;opacity:0.9}
.sidebar-section{padding:12px;border-bottom:1px solid var(--border)}
.sidebar-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.add-btn{width:100%;padding:8px;font-size:12px;border:1.5px dashed var(--border2);border-radius:var(--radius);background:transparent;cursor:pointer;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;font-family:'Noto Sans KR',sans-serif}
.add-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.client-list{flex:1;overflow-y:auto;padding:8px}
.client-item{padding:10px;border-radius:var(--radius);cursor:pointer;transition:all .15s;margin-bottom:3px;border:1px solid transparent}
.client-item:hover{background:var(--surface2)}
.client-item.active{background:var(--accent-bg);border-color:rgba(26,107,74,.2)}
.client-name{font-size:13px;font-weight:500;color:var(--text)}
.client-item.active .client-name{color:var(--accent-text)}
.client-prog-text{font-size:11px;color:var(--text3);margin-top:3px}
.client-item.active .client-prog-text{color:var(--accent)}
.prog-mini{height:3px;background:var(--border);border-radius:2px;margin-top:5px;overflow:hidden}
.prog-mini-bar{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.main-header{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.main-title{font-size:16px;font-weight:600;color:var(--text)}
.header-btns{display:flex;gap:6px}
.btn{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:7px 13px;font-size:12px;cursor:pointer;color:var(--text);display:inline-flex;align-items:center;gap:5px;transition:all .15s;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#155a3e}
.btn.danger{color:var(--danger);border-color:#fca5a5}
.btn.danger:hover{background:var(--danger-bg)}
.inner-tabs{display:flex;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.itab{padding:11px 14px;font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;background:transparent;border-top:none;border-left:none;border-right:none;transition:all .15s;margin-bottom:-1px;display:flex;align-items:center;gap:5px;font-family:'Noto Sans KR',sans-serif}
.itab:hover{color:var(--text)}
.itab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{flex:1;overflow-y:auto;padding:18px 20px;background:var(--bg)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px}
.stat-label{font-size:11px;color:var(--text3);margin-bottom:4px}
.stat-val{font-size:22px;font-weight:600}
.stat-val span{font-size:12px;font-weight:400;color:var(--text3)}
.prog-row{margin-bottom:16px}
.prog-label-text{font-size:11px;color:var(--text2);margin-bottom:5px}
.prog-bar-wrap{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.prog-bar{height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.section{margin-bottom:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.sec-hd{padding:10px 14px;background:var(--surface2);font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;color:var(--text);border-bottom:1px solid var(--border)}
.sec-badge{font-size:11px;font-weight:400;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1px 7px}
.item-row{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface);transition:background .1s}
.item-row:last-child{border-bottom:none}
.item-row:hover{background:#fafaf8}
.item-check{margin-top:2px;width:15px;height:15px;cursor:pointer;accent-color:var(--accent);flex-shrink:0}
.item-label{flex:1;font-size:13px;line-height:1.4}
.item-label.done{text-decoration:line-through;color:var(--text3)}
.item-note{font-size:11px;color:var(--text3);margin-top:2px}
.pill{font-size:10px;padding:2px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0;margin-top:2px;font-weight:500}
.pill-done{background:var(--accent-bg);color:var(--accent-text)}
.pill-none{background:var(--surface2);color:var(--text3);border:1px solid var(--border)}
.info-section{margin-bottom:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.info-sec-hd{padding:10px 14px;background:var(--surface2);font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;color:var(--text);border-bottom:1px solid var(--border)}
.info-sec-hd i{color:var(--accent);font-size:13px}
.info-body{padding:14px}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f-full{grid-column:1/-1}
.f-group{display:flex;flex-direction:column;gap:4px}
.f-label{font-size:11px;color:var(--text2);font-weight:600}
.f-input{width:100%;padding:8px 10px;font-size:13px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text);transition:border-color .15s;font-family:'Noto Sans KR',sans-serif}
.f-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,107,74,.08)}
textarea.f-input{resize:vertical;min-height:70px;line-height:1.5}
select.f-input{cursor:pointer}
.pw-wrap{display:flex;gap:4px}
.pw-wrap .f-input{flex:1;font-family:'JetBrains Mono',monospace}
.eye-btn{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;color:var(--text3);font-size:13px;padding:0 10px;flex-shrink:0;transition:all .15s}
.eye-btn:hover{color:var(--text);border-color:var(--accent)}
.save-bar{padding:11px 20px;border-top:1px solid var(--border);background:var(--surface);display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-shrink:0}
.save-msg{font-size:12px;color:var(--accent);display:flex;align-items:center;gap:5px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--text3);padding:60px 0}
.empty-state i{font-size:36px}
.empty-state p{font-size:13px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);padding:20px;width:100%;max-width:380px;box-shadow:var(--shadow-md)}
.modal h3{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:7px}
.modal h3 i{color:var(--accent)}
.modal-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:14px}
.modal-field{margin-bottom:10px}
.share-modal{max-width:460px}
.share-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-size:11px;color:var(--text2);font-family:'JetBrains Mono',monospace;white-space:pre-wrap;max-height:240px;overflow-y:auto;margin-top:10px;line-height:1.8}

/* ── 스케줄 ── */
#sch-mode-gantt.active,#sch-mode-calendar.active{background:var(--text);color:#fff;border-color:var(--text)}

/* 간트 */
.gantt-wrap{overflow:auto;flex:1}
.gantt-table{border-collapse:collapse;font-size:12px;min-width:900px;width:100%}
.gantt-table th{background:var(--surface2);padding:8px 10px;font-weight:600;color:var(--text2);border:1px solid var(--border);white-space:nowrap;font-size:11px;text-align:center;position:sticky;top:0;z-index:2}
.gantt-table th.name-col{text-align:left;width:140px;min-width:140px;position:sticky;left:0;z-index:3;background:var(--surface2)}
.gantt-table td{border:1px solid var(--border);padding:0;vertical-align:middle;background:var(--surface)}
.gantt-table td.name-col{padding:8px 10px;font-weight:500;font-size:12px;width:140px;min-width:140px;position:sticky;left:0;background:var(--surface);z-index:1;white-space:nowrap}
.gantt-table td.day-col{width:28px;min-width:28px;text-align:center;padding:6px 0;cursor:pointer;transition:background .1s;position:relative}
.gantt-table td.day-col:hover{background:var(--accent-bg)}
.gantt-table td.day-col.today-col{background:#fff8e1}
.gantt-table td.day-col.weekend{background:#fafafa}
.gantt-bar{position:absolute;top:50%;transform:translateY(-50%);height:14px;border-radius:7px;font-size:9px;color:#fff;display:flex;align-items:center;padding:0 5px;white-space:nowrap;overflow:hidden;cursor:pointer;z-index:1;font-weight:500}
.gantt-dot{width:10px;height:10px;border-radius:50%;margin:0 auto;display:block}
.gantt-row-group th{background:var(--surface2);padding:6px 10px;font-size:11px;font-weight:600;color:var(--text3);border:1px solid var(--border);text-align:left;position:sticky;left:0}

/* 캘린더 */
.cal-wrap{padding:14px 20px;flex:1;overflow:auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.cal-head{background:var(--surface2);padding:8px 0;text-align:center;font-size:11px;font-weight:600;color:var(--text2)}
.cal-head.sun{color:#e53e3e}
.cal-head.sat{color:#3182ce}
.cal-cell{background:var(--surface);min-height:90px;padding:6px;position:relative;cursor:pointer;transition:background .1s}
.cal-cell:hover{background:#fafaf8}
.cal-cell.other-month{background:#f9f8f6}
.cal-cell.today{background:#fff8e1}
.cal-date{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:3px}
.cal-date.sunday{color:#e53e3e}
.cal-date.saturday{color:#3182ce}
.cal-cell.today .cal-date{background:var(--accent);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px}
.cal-event{font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:500}
.cal-more{font-size:10px;color:var(--text3);padding:1px 5px}

/* 태스크 색상 팔레트 */
.tag-계약{background:#6366f1}.tag-디자인{background:#f59e0b}.tag-개발{background:#10b981}.tag-납품{background:#3b82f6}.tag-콘텐츠{background:#ec4899}.tag-SEO{background:#8b5cf6}.tag-기타{background:#6b7280}

/* 태스크 모달 */
.task-modal{max-width:440px}
.task-modal .f-grid{grid-template-columns:1fr 1fr}
.color-dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.color-dot.selected{border-color:var(--text);transform:scale(1.15)}
/* ── 로컬 저장 ── */
.sync-panel{padding:10px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
.sync-status{display:flex;align-items:center;gap:5px;font-size:11px;margin-bottom:6px;padding:4px 6px;border-radius:4px}
.sync-none{color:var(--text3)}
.sync-ok{color:var(--accent);background:var(--accent-bg)}
.sync-err{color:var(--danger);background:var(--danger-bg)}
.sync-ing{color:#1d4ed8;background:#dbeafe}
.sync-btn{width:100%;padding:8px;font-size:12px;font-weight:600;border:1.5px solid var(--accent);border-radius:var(--radius);background:var(--accent);cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;font-family:'Noto Sans KR',sans-serif}
.sync-btn:hover{background:#155a3e}
.sync-modal{max-width:420px}
.sync-log{font-size:11px;color:var(--text2);margin-top:8px;min-height:18px;font-family:'JetBrains Mono',monospace;background:var(--surface2);padding:6px 8px;border-radius:4px;line-height:1.6}

.summary-chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.chip{font-size:11px;padding:4px 10px;border-radius:12px;display:flex;align-items:center;gap:5px;font-weight:500}
.chip-green{background:var(--accent-bg);color:var(--accent-text)}
.chip-blue{background:#dbeafe;color:#1d4ed8}
.chip-gray{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.filter-bar{display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.filter-bar .fi{width:auto;padding:6px 10px;font-size:12px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:'Noto Sans KR',sans-serif}
.filter-bar .fi:focus{outline:none;border-color:var(--accent)}
.filter-bar input.fi{width:160px}
.filter-label{font-size:11px;color:var(--text3);font-weight:600;white-space:nowrap}
.filter-spacer{flex:1}
.filter-count{font-size:11px;color:var(--text3);white-space:nowrap}
.table-wrap{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:800px}
thead tr{background:var(--surface2);position:sticky;top:0;z-index:2}
thead th{padding:9px 10px;text-align:center;font-weight:600;color:var(--text2);border-bottom:2px solid var(--border);border-right:1px solid var(--border);white-space:nowrap;font-size:11px;line-height:1.3}
thead th:first-child{text-align:center;width:32px;position:sticky;left:0;background:var(--surface2);z-index:3}
thead th:nth-child(2){text-align:left;min-width:130px;position:sticky;left:32px;background:var(--surface2);z-index:3}
thead th:last-child{border-right:none;width:36px}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:hover{background:#fafaf8}
tbody td{padding:8px 10px;text-align:center;border-right:1px solid var(--border);vertical-align:middle}
tbody td:first-child{text-align:center;width:32px;position:sticky;left:0;background:var(--surface);z-index:1;padding:4px}
tbody td:nth-child(2){text-align:left;font-weight:500;font-size:13px;position:sticky;left:32px;background:var(--surface);z-index:1}
tbody tr:hover td:first-child,tbody tr:hover td:nth-child(2){background:#fafaf8}
tbody td:last-child{border-right:none}
.name-input{border:none;background:transparent;font-size:13px;font-family:'Noto Sans KR',sans-serif;font-weight:500;color:var(--text);width:100%;padding:2px 4px;border-radius:4px;cursor:text}
.name-input:focus{outline:none;background:var(--accent-bg);color:var(--accent-text)}
.svc-cell{cursor:pointer;user-select:none}
.svc-dot{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;transition:all .15s}
.svc-dot.on{background:var(--accent-bg);color:var(--accent)}
.svc-dot.off{background:var(--surface2);color:var(--border2)}
.svc-dot:hover{transform:scale(1.15)}
.svc-dot i{font-size:13px}
.wp-input{display:none}
.row-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:12px;padding:3px 6px;border-radius:4px;transition:all .15s;opacity:0}
tbody tr:hover .row-del{opacity:1}
.row-del:hover{background:var(--danger-bg);color:var(--danger)}
.add-row-btn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);padding:10px 14px;cursor:pointer;transition:all .15s;border-top:1px dashed var(--border);background:none;width:100%;font-family:'Noto Sans KR',sans-serif;border-bottom:none;border-left:none;border-right:none}
.add-row-btn:hover{background:var(--accent-bg);color:var(--accent)}
.legend-bar{display:flex;align-items:center;gap:14px;padding:8px 20px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)}

/* 드래그 앤 드롭 */
.drag-handle{cursor:grab;color:var(--border2);font-size:13px;padding:4px 6px;border-radius:4px;transition:color .15s;flex-shrink:0;user-select:none;opacity:0}
.col-resize{position:absolute;right:0;top:0;width:5px;height:100%;cursor:col-resize;background:transparent;z-index:10}
.col-resize:hover,.col-resize.resizing{background:var(--accent);opacity:.5}
.th-wrap{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;width:100%;height:100%}
.col-mgr-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:11px;padding:2px 4px;border-radius:3px;transition:all .15s}
.col-mgr-btn:hover{background:var(--accent-bg);color:var(--accent)}
/* 항목 관리 모달 */
.col-modal{max-width:500px}
.col-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;background:var(--surface);cursor:grab}
.col-item:hover{background:var(--surface2)}
.col-item.dragging-col{opacity:.4;background:var(--surface2)}
.col-item.drag-over-col{outline:2px solid var(--accent)}
.col-item-label{flex:1;font-size:13px;font-weight:500}
.col-item-key{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.col-vis{cursor:pointer;color:var(--text3);transition:color .15s}
.col-vis:hover{color:var(--accent)}
.col-vis.active{color:var(--accent)}
.new-col-row{display:flex;gap:6px;margin-top:10px}
tbody tr:hover .drag-handle{opacity:1}
.drag-handle:hover{color:var(--text2)}
.drag-handle:active{cursor:grabbing}
tbody tr.drag-over{background:#e8f5ee !important;outline:2px solid var(--accent);outline-offset:-2px}
tbody tr.dragging{opacity:.4;background:var(--surface2) !important}

::-webkit-scrollbar{width:5px;height:5px}

<body>

      </button>
    </div>
    <div class="client-list" id="clientList"></div>

    <!-- Supabase 저장 패널 -->

      <div id="syncStatus" class="sync-status sync-none">

      </div>
      <div style="display:flex;gap:5px;margin-bottom:5px">
        <button class="sync-btn" onclick="syncSave()" style="flex:1;font-size:11px">
          <i class="fa-solid fa-cloud-arrow-up"></i>저장
        </button>
        <button class="sync-btn" onclick="syncLoad()" style="flex:1;font-size:11px;border-color:var(--border2);background:var(--surface);color:var(--text2)">
          <i class="fa-solid fa-cloud-arrow-down"></i>불러오기
        </button>
      </div>
      <div style="display:flex;gap:5px">
        <button class="sync-btn" onclick="exportData()" style="flex:1;font-size:10px;border-color:var(--border2);background:var(--surface);color:var(--text2)">
          <i class="fa-solid fa-file-export"></i>내보내기

        <button class="sync-btn" onclick="document.getElementById('importFile').click()" style="flex:1;font-size:10px;border-color:var(--border2);background:var(--surface);color:var(--text2)">

  <!-- 거래처 상세 뷰 -->

        <button class="btn danger" onclick="deleteClient()"><i class="fa-solid fa-trash"></i>삭제</button>
      </div>
    </div>
    <div class="inner-tabs">

      <button class="itab" id="tab-account" onclick="switchTab('account')"><i class="fa-solid fa-lock"></i>계정 정보</button>
      <button class="itab" id="tab-clinic" onclick="switchTab('clinic')"><i class="fa-solid fa-stethoscope"></i>병원 정보</button>

    </div>
    <div class="tab-content" id="tabContent">

  <!-- 전체 현황 대시보드 -->

      <select class="fi" id="fService" onchange="applyFilter()">

        <option value="hp_move">홈페이지 이관</option>

        <option value="hp_new">홈페이지 신규</option>

        <option value="backlink">백링크</option>
        <option value="google_ai">구글리뷰AI</option>

      <table>
        <thead id="dashThead">

        </thead>
        <tbody id="dashBody"></tbody>
      </table>
      <div style="display:flex;border-top:1px dashed var(--border)">

          <i class="fa-solid fa-plus"></i>병원 행 추가

        <button class="add-row-btn" onclick="addNewColInline()" style="flex:1;border-top:none;border-left:1px dashed var(--border);color:var(--info, #1d4ed8)">
          <i class="fa-solid fa-table-columns"></i>항목 열 추가
        </button>
      </div>
    </div>

    <div class="legend-bar">
      <span style="font-size:11px;color:var(--text3);font-weight:600;margin-right:4px">범례</span>
      <div class="legend-item"><i class="fa-solid fa-circle-check" style="color:var(--accent)"></i>진행 중 (클릭으로 토글)</div>

      <div class="legend-item"><i class="fa-solid fa-grip-vertical" style="font-size:11px"></i>행 드래그로 순서 변경</div>
    </div>
  </div>

  <!-- 스케줄 관리 뷰 -->
  <div class="main" id="scheduleView" style="display:none">
    <div class="main-header">
      <div class="main-title"><i class="fa-solid fa-calendar-days" style="color:#1d4ed8;margin-right:6px;font-size:15px"></i>스케줄 관리</div>

        <button class="btn" id="sch-mode-calendar" onclick="setSchMode('calendar')">월간 캘린더</button>

<!-- 태스크 추가/편집 모달 -->
<div class="modal-overlay" id="taskModal">

      <button class="btn primary" onclick="saveTask()"><i class="fa-solid fa-check"></i>저장</button>

</div>



<!-- 거래처 추가 모달 -->
<div class="modal-overlay" id="addModal">

<!-- 항목 관리 모달 -->
<div class="modal-overlay" id="colModal">
  <div class="modal col-modal">
    <h3><i class="fa-solid fa-table-columns" style="color:var(--accent)"></i>항목 관리</h3>

    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModals()">닫기</button>

  </div>
</div>

</div>

<script>

const SECTIONS=[

  {key:"hp_move",  label:"홈페이지\n이관",    visible:true, width:60, group:"service"},

const SVC_KEYS = () => columns.map(c=>c.key);
const SVC_LABEL_MAP = () => Object.fromEntries(columns.map(c=>[c.key, c.label.replace(/\\n/g," ")]));
const visibleCols = () => columns.filter(c=>c.visible);

function newDashRow(name=""){

/* ─── 드래그 앤 드롭 ─── */
let dragSrcId=null;

function initDragDrop(){
  const tbody=document.getElementById("dashBody");
  if(!tbody)return;
  tbody.querySelectorAll("tr[data-id]").forEach(tr=>{
    tr.addEventListener("dragstart",e=>{
      // 입력 필드 드래그 시 무시
      if(e.target.tagName==="INPUT"||e.target.tagName==="BUTTON"){e.preventDefault();return;}
      dragSrcId=tr.dataset.id;
      tr.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      e.dataTransfer.setData("text/plain",dragSrcId);
    });
    tr.addEventListener("dragend",()=>{
      tr.classList.remove("dragging");
      tbody.querySelectorAll("tr").forEach(r=>r.classList.remove("drag-over"));
    });
    tr.addEventListener("dragover",e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect="move";
      tbody.querySelectorAll("tr").forEach(r=>r.classList.remove("drag-over"));
      if(tr.dataset.id!==dragSrcId) tr.classList.add("drag-over");
    });
    tr.addEventListener("dragleave",()=>tr.classList.remove("drag-over"));
    tr.addEventListener("drop",e=>{
      e.preventDefault();
      tr.classList.remove("drag-over");
      const targetId=tr.dataset.id;
      if(!dragSrcId||dragSrcId===targetId)return;
      // dashRows 배열에서 위치 교환
      const srcIdx=dashRows.findIndex(r=>r.id===dragSrcId);
      const tgtIdx=dashRows.findIndex(r=>r.id===targetId);
      if(srcIdx===-1||tgtIdx===-1)return;
      const [moved]=dashRows.splice(srcIdx,1);
      dashRows.splice(tgtIdx,0,moved);
      dragSrcId=null;
      renderDashboard();
    });
  });
}

/* ─── 항목(컬럼) 관리 ─── */
/* ─── 열 헤더 드래그로 순서 변경 ─── */
let colHeaderDragKey=null;
function colHeaderDragStart(e,key){
  colHeaderDragKey=key;
  e.dataTransfer.effectAllowed="move";
  e.currentTarget.style.opacity="0.4";
}
function colHeaderDragOver(e,key){
  e.preventDefault();
  if(key!==colHeaderDragKey){

let resizeKey=null,resizeStartX=0,resizeStartW=0;
function startResize(e,key){
  e.preventDefault();
  resizeKey=key;
  resizeStartX=e.clientX;
  if(key==="__clinic__"){
    resizeStartW=clinicColWidth;
  } else {
    const col=columns.find(c=>c.key===key);
    resizeStartW=col?col.width:60;
  }
  document.addEventListener("mousemove",doResize);
  document.addEventListener("mouseup",endResize);
}
function doResize(e){
  if(!resizeKey)return;
  const newW=Math.max(40,resizeStartW+(e.clientX-resizeStartX));
  if(resizeKey==="__clinic__"){
    clinicColWidth=newW;
    document.querySelectorAll(`th[data-key="__clinic__"]`).forEach(th=>{th.style.width=newW+"px";th.style.minWidth=newW+"px";});
    document.querySelectorAll(`#dashBody td:nth-child(2)`).forEach(td=>{td.style.width=newW+"px";td.style.minWidth=newW+"px";});
  } else {
    const col=columns.find(c=>c.key===resizeKey);
    if(!col)return;
    col.width=newW;
    document.querySelectorAll(`th[data-key="${resizeKey}"]`).forEach(th=>{th.style.width=newW+"px";th.style.minWidth=newW+"px";});
  }
}
function endResize(){
  resizeKey=null;
  document.removeEventListener("mousemove",doResize);
  document.removeEventListener("mouseup",endResize);
  renderDashboard(); // 정확히 다시 그림
}

/* ─── 간트차트 ─── */
function renderGantt(){
  const daysInMonth=new Date(schYear,schMonth+1,0).getDate();
  const today=new Date();
  const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
  const clinicNames=clients.map(c=>c.name);

  // 날짜 헤더
  let dayHeaders=`<th class="name-col" style="min-width:130px">병원명</th>`;
  for(let d=1;d<=daysInMonth;d++){
    const date=new Date(schYear,schMonth,d);
    const dow=date.getDay();
    const ds=`${schYear}-${String(schMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const isToday=ds===todayStr;
    const style=dow===0?"color:#e53e3e":dow===6?"color:#3182ce":"";
    dayHeaders+=`<th style="width:28px;min-width:28px;padding:4px 0;${style}${isToday?";background:#fff8e1":""}"><div style="font-size:10px">${["일","월","화","수","목","금","토"][dow]}</div><div style="font-size:11px;font-weight:700">${d}</div></th>`;
  }

  let rows="";
  clinicNames.forEach(name=>{
    const clinicTasks=tasks.filter(t=>t.clinic===name);
    const rowH=Math.max(40,clinicTasks.length*22+16);

    let dayCells=`<td class="name-col" style="height:${rowH}px;vertical-align:middle">${name}</td>`;
    for(let d=1;d<=daysInMonth;d++){
      const ds=`${schYear}-${String(schMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const date=new Date(schYear,schMonth,d);
      const dow=date.getDay();
      const isToday=ds===todayStr;
      const bg=isToday?"background:#fff8e1":dow===0||dow===6?"background:#fafafa":"";
      dayCells+=`<td style="width:28px;min-width:28px;height:${rowH}px;padding:0;border:1px solid var(--border);cursor:pointer;${bg}" onclick="openTaskModal('${name}','${ds}')"></td>`;
    }

    let bars="";
    clinicTasks.forEach((t,ti)=>{
      const s=new Date(t.start+"T00:00:00");
      const e=new Date(t.end+"T00:00:00");
      const monthStart=new Date(schYear,schMonth,1);
      const monthEnd=new Date(schYear,schMonth,daysInMonth);
      if(s>monthEnd||e<monthStart)return;
      const clampedS=s<monthStart?monthStart:s;
      const clampedE=e>monthEnd?monthEnd:e;
      const sd=clampedS.getDate();
      const ed=clampedE.getDate();
      const left=140+(sd-1)*28+2;
      const width=(ed-sd+1)*28-6;
      const color=CAT_COLOR[t.cat]||CAT_COLOR["기타"];
      const top=7+ti*22;
      bars+=`<div class="gantt-bar" style="left:${left}px;width:${width}px;background:${color};top:${top}px;height:16px;position:absolute;border-radius:4px;z-index:5" onclick="event.stopPropagation();openTaskModal('${name}',null,'${t.id}')" title="${t.title}">${t.title}</div>`;
    });

    rows+=`<tr style="position:relative">${dayCells}</tr>`;
    if(bars) rows+=`<tr style="height:0"><td colspan="${daysInMonth+1}" style="padding:0;border:none;height:0;position:relative"><div style="position:absolute;top:-${rowH}px;left:0;width:${140+daysInMonth*28}px;height:${rowH}px;pointer-events:none;overflow:visible">${bars}</div></td></tr>`;
  });

  document.getElementById("scheduleContent").innerHTML=`
    <div style="overflow:auto;flex:1;padding:16px 20px">
      <table class="gantt-table" style="table-layout:fixed">
        <thead><tr>${dayHeaders}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderCalendar(){
  const firstDay=new Date(schYear,schMonth,1).getDay();
  const daysInMonth=new Date(schYear,schMonth+1,0).getDate();
  const prevDays=new Date(schYear,schMonth,0).getDate();

  let cells="";
  let dayCount=0;
  // 이전달 날짜
  for(let i=firstDay-1;i>=0;i--){
    cells+=`<div class="cal-cell other-month"><div class="cal-date" style="color:var(--text3)">${prevDays-i}</div></div>`;
    dayCount++;
  }
  // 이번달
  for(let d=1;d<=daysInMonth;d++){
    const date=new Date(schYear,schMonth,d);
    const dow=date.getDay();
    const isToday=date.toDateString()===today.toDateString();
    const ds=`${schYear}-${String(schMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const dayTasks=tasks.filter(t=>{
      const s=new Date(t.start),e=new Date(t.end),cur=new Date(ds);
      return cur>=s&&cur<=e;
    });
    const maxShow=3;
    const eventsHtml=dayTasks.slice(0,maxShow).map(t=>`<div class="cal-event tag-${t.cat}" style="background:${CAT_COLOR[t.cat]}" onclick="event.stopPropagation();openTaskModal(null,null,'${t.id}')" title="${t.clinic}: ${t.title}">${t.clinic.slice(0,4)} ${t.title.slice(0,5)}</div>`).join("");
    const moreHtml=dayTasks.length>maxShow?`<div class="cal-more">+${dayTasks.length-maxShow}개</div>`:"";
    const dateClass=`cal-date${dow===0?" sunday":dow===6?" saturday":""}`;
    cells+=`<div class="cal-cell${isToday?" today":""}" onclick="openTaskModal(null,'${ds}')">
      <div class="${dateClass}">${d}</div>
      ${eventsHtml}${moreHtml}
    </div>`;
    dayCount++;
  }
  // 다음달
  let next=1;
  while(dayCount%7!==0){cells+=`<div class="cal-cell other-month"><div class="cal-date" style="color:var(--text3)">${next++}</div></div>`;dayCount++;}

  document.getElementById("scheduleContent").innerHTML=`
    <div class="cal-wrap">
      <div class="cal-grid">${heads}${cells}</div>
    </div>`;
}

/* ─── 태스크 모달 ─── */
function openTaskModal(clinicName, dateStr, taskId=null){
  editTaskId=taskId;
  // 병원 select 채우기
  const sel=document.getElementById("t_clinic");
  sel.innerHTML=clients.map(c=>`<option value="${c.name}">${c.name}</option>`).join("");
  if(taskId){
    const t=tasks.find(t=>t.id===taskId);
    if(!t)return;
    document.getElementById("taskModalTitle").textContent="일정 편집";
    document.getElementById("taskDeleteBtn").style.display="inline-flex";
    sel.value=t.clinic;
    document.getElementById("t_title").value=t.title;
    document.getElementById("t_start").value=t.start;
    document.getElementById("t_end").value=t.end;
    document.getElementById("t_cat").value=t.cat;
    document.getElementById("t_memo").value=t.memo||"";
  } else {
    document.getElementById("taskModalTitle").textContent="일정 추가";
    document.getElementById("taskDeleteBtn").style.display="none";
    if(clinicName)sel.value=clinicName;
    const ds=dateStr||`${schYear}-${String(schMonth+1).padStart(2,"0")}-01`;
    document.getElementById("t_start").value=ds;
    document.getElementById("t_end").value=ds;
    document.getElementById("t_title").value="";
    document.getElementById("t_cat").value="기타";
    document.getElementById("t_memo").value="";
  }
  document.getElementById("taskModal").classList.add("open");
  setTimeout(()=>document.getElementById("t_title").focus(),100);
}

function saveTask(){
  const clinic=document.getElementById("t_clinic").value;
  const title=document.getElementById("t_title").value.trim();
  const start=document.getElementById("t_start").value;
  const end=document.getElementById("t_end").value;
  const cat=document.getElementById("t_cat").value;
  const memo=document.getElementById("t_memo").value.trim();
  if(!title||!start||!end){alert("병원명, 작업 내용, 날짜를 입력해주세요.");return;}
  if(editTaskId){
    const t=tasks.find(t=>t.id===editTaskId);
    if(t)Object.assign(t,{clinic,title,start,end,cat,memo});
  } else {
    tasks.push({id:"t"+Date.now(),clinic,title,start,end,cat,memo});
  }
  closeModals();
  renderSchedule();
  autoSync();
}

function deleteTask(){
  if(!editTaskId)return;
  if(!confirm("이 일정을 삭제하시겠습니까?"))return;
  tasks=tasks.filter(t=>t.id!==editTaskId);
  closeModals();
  renderSchedule();
  autoSync();
}

</script>
